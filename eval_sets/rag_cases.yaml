  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "long-term"
  difficulty: medium
  golden_answer: "长期优化包括：代码性能优化、增加监控告警阈值、完善自动扩缩容策略、定期进行压力测试。"

- id: cpu_verify_002
  question: "CPU 告警处理后怎样确认已经恢复？使用率降到多少算正常？"
  expected_doc_ids:
