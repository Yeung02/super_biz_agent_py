    - "cleanup"
  difficulty: easy
  golden_answer: "应快速查找并清理大日志或临时文件，必要时压缩或删除旧日志；如果无法快速释放空间，应立即扩容磁盘。"

- id: disk_high_usage_002
  question: "文件上传临时目录满了，应该如何排查和预防临时文件堆积？"
  expected_doc_ids:
