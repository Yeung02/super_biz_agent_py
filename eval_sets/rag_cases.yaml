  golden_answer: "应确认磁盘使用率降到 70% 以下、应用运行正常、日志可以正常写入、数据库运行正常，并持续监控磁盘使用情况。"

- id: disk_prevention_002
  question: "磁盘使用率过高问题的预防措施有哪些？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
