# RAG eval set（100 cases，覆盖 5 个 runbook 全链路）。
# 该文件只描述离线评估数据，不被线上 FastAPI 默认导入；这样可以为检索/生成指标
# 提供稳定 baseline，同时避免在线路径耦合评估集。
# expected_doc_ids 使用 ISSUE-018 的稳定 doc_id 规则生成，防止评估集和索引主键漂移。
# 构成：5 个告警 runbook 各 17 条（easy 直查 / medium 复述 / hard 间接问法），
# 3 条跨文档 case，12 条拒答 case（知识库无依据，验证不编造）。
# ============================================================
# CPU 使用率过高（doc_6670fc2e2e2afacf6b534582b60c22d5）
# ============================================================
- id: cpu_high_usage_001
  question: "CPU 使用率持续超过 80% 时，应该先查哪些日志和指标？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "HighCPUUsage"
    - "system-metrics"
    - "cpu_usage"
    - "进程"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "runbook"
    - "log-query"
  difficulty: easy
  golden_answer: "应先确认 HighCPUUsage 告警时间，查询 system-metrics 中 cpu_usage 超过阈值的记录，再结合进程信息和应用日志定位高 CPU 来源。"

- id: cpu_high_usage_002
  question: "如果多个进程 CPU 使用率一起升高，并且请求量明显增加，应如何处理？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "流量突增"
    - "自动扩容"
    - "限流"
    - "响应时间"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "traffic-spike"
    - "mitigation"
  difficulty: medium
  golden_answer: "这种特征更像流量突增，应检查活动或突发流量，启动自动扩容；若是恶意流量，应启用限流并持续监控扩容后的 CPU 使用率。"

- id: cpu_high_usage_003
  question: "固定时间点 CPU 周期性升高，怀疑是任务重叠执行，处理思路是什么？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "定时任务重叠执行"
    - "调整任务执行时间"
    - "互斥锁"
    - "周期性"
  should_answer: true
  case_type: low_score
  tags:
    - "cpu"
    - "scheduled-task"
    - "indirect-query"
  difficulty: hard
  golden_answer: "应检查定时任务配置和日志，确认是否有任务重叠执行；处理上可调整任务执行时间、优化任务逻辑，并增加任务执行互斥锁。"

- id: cpu_trigger_condition_002
  question: "HighCPUUsage 告警的触发条件是什么？持续多久、超过多少会触发？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "80%"
    - "5分钟"
    - "严重"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "alert-rule"
  difficulty: easy
  golden_answer: "HighCPUUsage 为严重级别告警，触发条件是 CPU 使用率持续 5 分钟超过 80%。"

- id: cpu_query_region_002
  question: "排查 CPU 告警时查询系统日志应指定哪个地域和日志主题？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "ap-guangzhou"
    - "system-metrics"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "log-query"
    - "region"
  difficulty: easy
  golden_answer: "应指定地域 ap-guangzhou（广州），日志主题为 system-metrics，时间范围最近 30 分钟。"

- id: cpu_query_condition_002
  question: "查询系统指标日志时用什么查询条件能定位 CPU 告警记录？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "cpu_usage"
