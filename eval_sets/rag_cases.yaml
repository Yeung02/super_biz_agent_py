  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "log-query"
    - "query-syntax"
  difficulty: easy
  golden_answer: "可使用 cpu_usage > 80（或 cpu_usage:>80）配合 service_name:* 作为查询条件，时间范围取最近 30 分钟。"

- id: cpu_deadloop_feature_002
  question: "单个进程 CPU 占用接近 100%，应用日志中有大量重复的错误堆栈，最可能是什么原因？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "死循环"
    - "递归"
    - "重启"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "deadloop"
    - "root-cause"
  difficulty: medium
  golden_answer: "最可能是代码死循环或无限递归；特征还包括内存使用同步增长。应立即重启受影响实例，回滚到稳定版本，并通知开发修复。"

- id: cpu_deadloop_handle_002
  question: "确认是代码 bug 导致死循环 CPU 飙高后，应执行哪些处理动作？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "重启"
    - "回滚"
    - "修复"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "deadloop"
    - "mitigation"
  difficulty: medium
  golden_answer: "应立即重启受影响的服务实例，查看应用日志定位代码问题，回滚到上一个稳定版本，并通知开发团队修复代码 bug。"

- id: cpu_traffic_feature_002
  question: "流量突增导致的 CPU 升高在日志上有什么特征？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "均匀升高"
    - "请求量"
    - "响应时间"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "traffic-spike"
    - "feature"
  difficulty: medium
  golden_answer: "特征是多个进程 CPU 使用率均匀升高、请求量明显增加、响应时间变长但无明显错误。"

- id: cpu_slowquery_002
  question: "应用 CPU 高但业务逻辑简单，数据库连接池占用也高，可能是什么原因？怎么处理？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "慢查询"
    - "索引"
    - "缓存层"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "database"
    - "root-cause"
  difficulty: medium
  golden_answer: "可能是数据库查询慢：特征为应用 CPU 高但业务逻辑简单、日志有慢查询记录、连接池占用高。应查询慢 SQL 日志、优化 SQL 或添加索引、检查全表扫描，并考虑增加缓存层。"

- id: cpu_emergency_002
  question: "CPU 严重告警时 5 分钟内可以执行哪些立即操作？"
  expected_doc_ids:
    - "doc_6670fc2e2e2afacf6b534582b60c22d5"
  expected_keywords:
    - "扩容"
    - "限流"
    - "重启"
  should_answer: true
  case_type: answer
  tags:
    - "cpu"
    - "emergency"
  difficulty: easy
  golden_answer: "5 分钟内可执行：流量问题立即扩容增加实例；怀疑恶意流量启用限流规则；单个实例问题则重启该实例。"

- id: cpu_longterm_002
  question: "CPU 告警处理完成之后，长期应该做哪些优化？"
  expected_doc_ids:
