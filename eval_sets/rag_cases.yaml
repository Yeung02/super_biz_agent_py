    - "inode"
    - "indirect-query"
  difficulty: hard
  golden_answer: "可能是 inode 耗尽（InodeFull 告警），应使用 df -i 检查 inode 使用情况，清理大量小文件释放 inode。"

- id: disk_verify_002
  question: "磁盘告警处理后使用率降到多少算安全？验证时要确认什么？"
  expected_doc_ids:
