    - "temp-files"
    - "prevention"
  difficulty: medium
  golden_answer: "应检查 /tmp 或应用临时目录的大文件和历史文件，删除过期临时文件；预防上应设置定时清理、处理完成后立即删除，并限制临时文件大小。"

- id: disk_high_usage_003
  question: "Docker 镜像、停止容器和容器日志占满磁盘时应执行哪些治理动作？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "docker image prune"
    - "docker container prune"
    - "docker system prune"
    - "容器日志"
  should_answer: true
  case_type: low_score
  tags:
    - "disk"
