    - "indirect-query"
  difficulty: hard
  golden_answer: "应清理未使用镜像、停止容器和未使用卷，可使用 docker image prune、docker container prune、docker system prune；同时限制容器日志大小并设置日志轮转。"

- id: disk_level_002
  question: "HighDiskUsage 告警的警告和严重级别分别是按什么阈值划分的？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "80%"
    - "90%"
    - "警告"
  should_answer: true
  case_type: answer
  tags:
    - "disk"
    - "alert-rule"
  difficulty: easy
  golden_answer: "HighDiskUsage 按使用率超过 80% 为警告、超过 90% 为严重；触发条件为持续 5 分钟超过阈值。"

- id: disk_logrotate_002
  question: "日志文件过大导致磁盘告警，应如何配置日志轮转？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "logrotate"
    - "保留天数"
    - "压缩"
  should_answer: true
  case_type: answer
  tags:
