- id: disk_high_usage_001
  question: "磁盘使用率超过 90% 且日志无法写入时，5 分钟内应怎么释放空间？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "HighDiskUsage"
    - "日志文件"
