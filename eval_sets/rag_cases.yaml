    - "logrotate"
    - "prevention"
  difficulty: medium
  golden_answer: "应启用 logrotate，设置日志保留天数、配置日志压缩，并限制单个日志文件大小。"

- id: disk_loglevel_002
  question: "生产环境日志级别应如何设置来控制磁盘占用？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "INFO"
    - "WARN"
    - "大对象"
  should_answer: true
  case_type: answer
  tags:
    - "disk"
    - "log-level"
  difficulty: medium
  golden_answer: "生产环境应使用 INFO 或 WARN 级别，避免打印大对象，减少不必要的日志输出。"

- id: disk_data_growth_002
  question: "业务数据量激增导致数据库文件持续增长，磁盘快满了怎么治理？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "归档"
    - "扩容"
    - "冷热数据分离"
  should_answer: true
  case_type: answer
  tags:
    - "disk"
    - "data-growth"
    - "archiving"
  difficulty: medium
  golden_answer: "应删除过期数据、归档历史数据、清理测试数据；建立数据归档策略并使用对象存储保存归档数据，实现冷热数据分离；如果是正常业务增长则扩容磁盘。"

- id: disk_backup_clean_002
  question: "备份文件占满磁盘空间时应如何清理和优化备份策略？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "备份"
    - "mtime +30"
    - "增量备份"
  should_answer: true
  case_type: answer
  tags:
    - "disk"
    - "backup"
  difficulty: medium
  golden_answer: "使用 find /backup -name \"*.bak\" -mtime +30 删除 30 天前的备份；优化策略为只保留最近 N 天备份、压缩备份文件、备份到对象存储并实现增量备份。"

- id: disk_cache_clean_002
  question: "应用缓存文件过多占用磁盘，应如何清理和优化？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "缓存"
    - "过期时间"
    - "LRU"
  should_answer: true
  case_type: answer
  tags:
    - "disk"
    - "cache"
  difficulty: medium
  golden_answer: "可清理应用缓存目录；优化上应设置缓存过期时间、限制缓存大小、实现 LRU 淘汰策略，或使用 Redis 等外部缓存。"

- id: disk_docker_002
  question: "Docker 占用大量磁盘空间，应执行哪些清理命令？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "docker image prune"
    - "docker container prune"
    - "docker volume prune"
  should_answer: true
  case_type: answer
  tags:
    - "disk"
    - "docker"
    - "cleanup"
  difficulty: medium
  golden_answer: "可执行 docker image prune -a 清理未使用镜像、docker container prune 清理停止容器、docker volume prune 清理未使用卷，或使用 docker system prune -a --volumes 一次性清理。"

- id: disk_df_du_002
  question: "查看磁盘使用率和目录大小的常用命令有哪些？"
  expected_doc_ids:
    - "doc_d9b4d028c9110e9a34f15bb7509f7e39"
  expected_keywords:
    - "df"
    - "du"
    - "find"
  should_answer: true
  case_type: answer
  tags:
