  golden_answer: "相关告警包括 HighMemoryUsage（内存使用率过高）、HighLoadAverage（系统负载过高）和 SlowResponse（响应时间过长）。"

- id: cpu_applog_condition_002
  question: "排查 CPU 告警时，应用日志应该用什么主题和查询条件？"
