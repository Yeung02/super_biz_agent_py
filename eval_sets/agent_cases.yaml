  required_tools:
    - "query_cpu_metrics"
  forbidden_tools: []
  expected_keywords:
    - "CPU"
  max_steps_budget: 5
  case_type: diagnose
  tags:
    - "cpu"
    - "diagnosis"
  difficulty: easy
  golden_answer: "应调用 query_cpu_metrics 获取 CPU 使用率，结合阈值判断并给出排查结论。"

