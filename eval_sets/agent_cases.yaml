# Agent 轨迹评测集（100 cases，离线评估数据，不被线上 FastAPI 默认导入）。
#
# 与 rag_cases.yaml 的区别：这里评的是 Plan-Execute-Replan 的"轨迹质量"——
# - required_tools / forbidden_tools 校验工具选择是否正确；
# - max_steps_budget 校验执行效率（步数是否超预算）；
# - expected_keywords 校验最终答案是否达成任务目标；
# - should_complete=false 的用例评估拒答行为（不编造、不乱调工具）。
#
# 工具名与线上保持一致：本地 get_current_time / retrieve_knowledge，
# MCP query_cpu_metrics / query_memory_metrics / get_current_timestamp /
# get_region_code_by_name / get_topic_info_by_name /
# search_topic_by_service_name / search_log。
#
# 构成：38 diagnose / 40 tool_query / 22 out_of_scope。
# ============================================================
# diagnose：指标诊断 + 知识库诊断 + 日志诊断
# ============================================================
- id: cpu_diagnosis_001
